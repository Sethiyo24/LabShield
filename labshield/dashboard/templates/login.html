<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabShield Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hi: #1c2128;
      --border: #21262d;
      --text: #e6edf3;
      --text-sub: #8b949e;
      --text-muted: #484f58;
      --red: #f85149;
      --blue: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 32px;
      width: 90%;
      max-width: 400px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .dot-red {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }
    .brand {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--text-sub);
      text-transform: uppercase;
    }
    .title {
      font-size: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      background: var(--surface-hi);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
    .btn-enter {
      width: 100%;
      height: 40px;
      background: rgba(88, 166, 255, 0.2);
      border: 0.5px solid var(--blue);
      color: var(--blue);
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
    }
    .error {
      display: none;
      color: var(--red);
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-row">
      <span class="dot-red"></span>
      <span class="brand">LABSHIELD</span>
    </div>
    <h1 class="title">Teacher Login</h1>
    <label class="label" for="password">Password</label>
    <input class="input" type="password" id="password" placeholder="Enter dashboard password" autofocus>
    <button class="btn-enter" id="btnEnter">Enter</button>
    <div class="error" id="loginError">Incorrect password</div>
  </div>
  <script>
    async function submitLogin() {
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });
        const data = await resp.json();
        if (data.success) {
          window.location.href = '/';
          return;
        }
        errEl.style.display = 'block';
        errEl.textContent = data.error || 'Incorrect password';
      } catch (err) {
        errEl.style.display = 'block';
        errEl.textContent = err.message;
      }
    }
    document.getElementById('btnEnter').addEventListener('click', submitLogin);
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitLogin();
    });
  </script>
</body>
</html>
